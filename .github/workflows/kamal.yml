name: KAMAL Command
on:
  workflow_dispatch:
    inputs:
      command:
        description: "KAMAL command to run"
        default: "kamal app details"
jobs:
  Command:
    runs-on: ubuntu-latest
    env:
      RAINGAUGE_KAMAL_SERVER_HOST: ${{ secrets.RAINGAUGE_KAMAL_SERVER_HOST }}
      RAINGAUGE_KAMAL_PROXY_HOST: ${{ vars.RAINGAUGE_KAMAL_PROXY_HOST }}
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      KAMAL_REGISTRY_USERNAME: ${{ secrets.KAMAL_REGISTRY_USERNAME }}
      RAINGAUGE_ADMIN_USERNAME: ${{ secrets.RAINGAUGE_ADMIN_USERNAME }}
      RAINGAUGE_ADMIN_PASSWORD: ${{ secrets.RAINGAUGE_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.RAINGAUGE_KAMAL_SSH_PRIVATE_KEY }}
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.5
      - name: Install dependencies
        run: |
          gem install kamal -v 2.12.0
      - name: Run KAMAL command
        run: ${{ github.event.inputs.command }}
