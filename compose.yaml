services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pembana_rain_gauge
      POSTGRES_USER: pembana
      POSTGRES_PASSWORD: pembana
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pembana -d pembana_rain_gauge"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - rain-gauge-postgres:/var/lib/postgresql/data

volumes:
  rain-gauge-postgres:
